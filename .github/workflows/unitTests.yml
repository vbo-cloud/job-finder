name: Unit Tests

# Runs on every PR regardless of which files changed.
# Change detection inside the workflow determines which test jobs execute.
# The unit-tests-gate job is always the single required status check for branch protection.
on:
  pull_request:

permissions:
  contents: read

env:
  # Silences Node.js 20 deprecation warnings ahead of GitHub's forced migration to Node.js 24 in June 2026
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ============================================================
  # 1. Detect which layer(s) changed
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$CHANGED"

          python=false
          frontend=false

          while IFS= read -r file; do
            if [[ "$file" == JobFinder/python/* ]]; then
              python=true
            fi
            if [[ "$file" == JobFinder/frontend/* ]]; then
              frontend=true
            fi
          done <<< "$CHANGED"

          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  # ============================================================
  # 2. Test — Python (pytest)
  # ============================================================
  test-python:
    needs: detect-changes
    if: needs.detect-changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: ./JobFinder/python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            JobFinder/python/agents/webapp/requirements.txt
            JobFinder/python/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r agents/webapp/requirements.txt -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest -v --tb=short

  # ============================================================
  # 3. Test — Frontend (Jest + TypeScript)
  # ============================================================
  test-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ./JobFinder/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: JobFinder/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Run Jest tests
        run: npm test -- --watchAll=false --ci

  # ============================================================
  # 4. Gate — single required status check for branch protection
  # ============================================================
  unit-tests-gate:
    needs: [test-python, test-frontend]
    # always() ensures this job runs even when test jobs are skipped or failed,
    # so branch protection always has a result to evaluate.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          python="${{ needs.test-python.result }}"
          frontend="${{ needs.test-frontend.result }}"
          echo "test-python  : $python"
          echo "test-frontend: $frontend"
          for result in "$python" "$frontend"; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ A test job failed or was cancelled."
              exit 1
            fi
          done
          echo "✅ All test jobs passed or were skipped."
