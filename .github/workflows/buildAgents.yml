name: Build Application Images

# Builds and pushes Docker images for all agents (matching, cleanup, offer-fetching) and the
# frontend to ACR. Triggered on changes to JobFinder/python/ or JobFinder/frontend/ to keep
# images in sync with code.
on:
  push:
    branches: [dev]
    paths:
      - 'JobFinder/python/**'
      - 'JobFinder/frontend/**'
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC authentication with Azure
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch ACR login server from Key Vault
        run: |
          ACR_LOGIN_SERVER=$(az keyvault secret show \
            --vault-name ${{ vars.AZURE_KEYVAULT_NAME }} \
            --name "acr-login-server" --query value -o tsv)
          ACR_NAME=$(echo "$ACR_LOGIN_SERVER" | cut -d'.' -f1)
          echo "::add-mask::$ACR_LOGIN_SERVER"
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV
          echo "ACR_NAME=$ACR_NAME"               >> $GITHUB_ENV

      - name: Docker login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push matching image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/matching/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/agents/matching:latest
            ${{ env.ACR_LOGIN_SERVER }}/agents/matching:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/matching:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/matching:cache,mode=max

      - name: Build and push cleanup image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/cleanup/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/agents/cleanup:latest
            ${{ env.ACR_LOGIN_SERVER }}/agents/cleanup:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/cleanup:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/cleanup:cache,mode=max

      - name: Build and push offer-fetching image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/offer_fetching/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/agents/offer-fetching:latest
            ${{ env.ACR_LOGIN_SERVER }}/agents/offer-fetching:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/offer-fetching:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/offer-fetching:cache,mode=max

      - name: Build webapp image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/webapp/Dockerfile
          push: false
          load: true
          tags: webapp-local:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/webapp:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/webapp:cache,mode=max

      - name: Smoke-test webapp image
        run: |
          # shared/embedder.py reads AZURE_OPENAI_API_KEY at module level and raises
          # ValueError if absent. Required until OpenAI managed identity migration
          # (see backlog: "Passer local_auth_enabled=false + Managed Identity sur OpenAI").
          docker run --rm \
            -e DATABASE_URL=postgresql://x:x@localhost/x \
            -e ENTRA_EXTERNAL_TENANT_ID=x \
            -e ENTRA_EXTERNAL_CLIENT_ID=x \
            -e AZURE_STORAGE_ACCOUNT_URL=https://x.blob.core.windows.net \
            -e AZURE_SERVICEBUS_FULLY_QUALIFIED_NAMESPACE=x.servicebus.windows.net \
            -e AZURE_OPENAI_ENDPOINT=https://x.openai.azure.com \
            -e AZURE_OPENAI_API_KEY=x \
            webapp-local:${{ github.sha }} \
            python -c "import main; print('smoke-test OK')"

      - name: Push webapp image to ACR
        run: |
          docker tag webapp-local:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/agents/webapp:latest
          docker tag webapp-local:${{ github.sha }} ${{ env.ACR_LOGIN_SERVER }}/agents/webapp:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/agents/webapp:latest
          docker push ${{ env.ACR_LOGIN_SERVER }}/agents/webapp:${{ github.sha }}

      - name: Build and push cv-analysis image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/cv_analysis/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/agents/cv-analysis:latest
            ${{ env.ACR_LOGIN_SERVER }}/agents/cv-analysis:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/cv-analysis:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/cv-analysis:cache,mode=max

      - name: Build and push match-analysis image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/python
          file: JobFinder/python/agents/match_analysis/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/agents/match-analysis:latest
            ${{ env.ACR_LOGIN_SERVER }}/agents/match-analysis:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/match-analysis:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/agents/match-analysis:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: JobFinder/frontend
          file: JobFinder/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/frontend:latest
            ${{ env.ACR_LOGIN_SERVER }}/frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.NEXT_PUBLIC_ENTRA_CLIENT_ID }}
            NEXT_PUBLIC_ENTRA_AUTHORITY=${{ vars.NEXT_PUBLIC_ENTRA_AUTHORITY }}
            NEXT_PUBLIC_ENTRA_KNOWN_AUTHORITY=${{ vars.NEXT_PUBLIC_ENTRA_KNOWN_AUTHORITY }}
            NEXT_PUBLIC_ENTRA_API_SCOPE=${{ vars.NEXT_PUBLIC_ENTRA_API_SCOPE }}
            NEXT_PUBLIC_REDIRECT_URI=${{ vars.NEXT_PUBLIC_REDIRECT_URI }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/frontend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/frontend:cache,mode=max

      - name: Build summary
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/matching:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/cleanup:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/offer-fetching:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/webapp:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/cv-analysis:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/agents/match-analysis:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`$ACR_LOGIN_SERVER/frontend:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Update Container App and Container App Job images
        run: |
          az containerapp job update \
            --name job-jf-dev-frc-matching \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/matching:${{ github.sha }}
          az containerapp job update \
            --name job-jf-dev-frc-cleanup \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/cleanup:${{ github.sha }}
          az containerapp job update \
            --name job-jf-dev-frc-fetch \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/offer-fetching:${{ github.sha }}
          az containerapp update \
            --name app-jf-dev-frc \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/webapp:${{ github.sha }}
          az containerapp job update \
            --name job-jf-dev-frc-cv-analysis \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/cv-analysis:${{ github.sha }}
          az containerapp job update \
            --name job-jf-dev-frc-match-analysis \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/agents/match-analysis:${{ github.sha }}
          az containerapp update \
            --name app-jf-dev-frc-frontend \
            --resource-group rg-jf-dev-frc-app \
            --subscription ${{ vars.AZURE_SUBSCRIPTION_ID }} \
            --image $ACR_LOGIN_SERVER/frontend:${{ github.sha }}
